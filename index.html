<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>清梦姜愁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f3efe7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            max-width: 680px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.02);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #ece7df;
            transition: none;
            pointer-events: none;
        }

        .title {
            font-size: 2.4rem;
            font-weight: 350;
            letter-spacing: 0.18em;
            color: #3e3a36;
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        .subhead {
            font-size: 0.85rem;
            letter-spacing: 0.32em;
            color: #a69b90;
            margin-bottom: 32px;
            text-transform: uppercase;
            text-align: center;
            font-weight: 300;
            border-bottom: 1px solid #ded8d0;
            padding-bottom: 16px;
            width: 100%;
            pointer-events: none;
        }

        .verse {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 100%;
            pointer-events: none;
        }

        .line {
            font-size: 1.35rem;
            font-weight: 300;
            color: #4f4943;
            text-align: center;
            letter-spacing: 0.04em;
            line-height: 1.7;
            padding: 0 10px;
            word-break: break-word;
            pointer-events: none;
        }

        .line span {
            display: inline-block;
            padding: 0 2px;
            border-bottom: 1px solid transparent;
            transition: none;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #d9d2c9;
            margin: 18px 0 10px;
            pointer-events: none;
        }

        .footnote {
            margin-top: 38px;
            font-size: 0.7rem;
            color: #b8aea4;
            letter-spacing: 0.3em;
            text-align: center;
            font-weight: 300;
            text-transform: uppercase;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 22px;
            }

            .title {
                font-size: 1.9rem;
                letter-spacing: 0.14em;
            }

            .line {
                font-size: 1.15rem;
                line-height: 1.8;
            }

            .subhead {
                font-size: 0.7rem;
                letter-spacing: 0.25em;
            }

            .footnote {
                font-size: 0.6rem;
                letter-spacing: 0.25em;
            }
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
        }

        ::selection {
            background: transparent;
        }

        a, button, input, textarea, select, [role="button"] {
            pointer-events: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .card, .card * {
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .card::before, .card::after {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">清梦姜愁</div>
        <div class="subhead">QING MENG JIANG CHOU</div>
        <div class="verse">
            <div class="line">一枕清梦压星河</div>
            <div class="line">半盏姜茶暖旧愁</div>
            <div class="divider"></div>
            <div class="line">风摇竹影移窗静</div>
            <div class="line">月落檐牙挂玉钩</div>
            <div class="line">欲写云笺无雁过</div>
            <div class="line">且将心事付东流</div>
        </div>
        <div class="footnote">清 · 梦 · 姜 · 愁</div>
    </div>
</body>
</html>
